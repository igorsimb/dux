<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>{% block title %}AI{% endblock %}</title>
    <script>
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    </script>
    <script type="module"
            src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.2/bundles/datastar.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css"/>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-base-200 text-base-content antialiased"
      data-signals="{ sidebarOpen: false }"
      data-init="const savedSidebarState = localStorage.getItem('sidebar-open');
                 const desktopDefault = window.matchMedia('(min-width: 1024px)').matches;
                 $sidebarOpen = savedSidebarState === null ? desktopDefault : savedSidebarState === '1';"
      data-effect="localStorage.setItem('sidebar-open', $sidebarOpen ? '1' : '0')">
<div class="flex min-h-screen bg-base-200" id="app-shell">
    <aside class="hidden shrink-0 overflow-hidden border-r border-base-300 bg-base-100 transition-all duration-300 ease-in-out lg:block"
           data-style:width="$sidebarOpen ? 'min(14.5rem, calc(100vw - 5rem))' : '0px'">
        {% include "core/navbar.html" with sidebar_mode="desktop" theme_toggle_id="theme-toggle-desktop" %}
    </aside>
    <div class="flex min-w-0 flex-1 flex-col">
        <header class="sticky top-0 z-30 border-b border-base-300 bg-base-100/90 backdrop-blur">
            <div class="navbar min-h-14 px-3">
                <button type="button"
                        class="btn btn-ghost btn-square"
                        aria-label="Toggle menu"
                        data-attr:aria-expanded="$sidebarOpen"
                        data-on:click__viewtransition="$sidebarOpen = !$sidebarOpen">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                         stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <div class="ml-2 text-lg font-semibold tracking-wide">
                    Dux <small class="text-xs opacity-70">v0.9.35</small>
                </div>
            </div>
        </header>
        <main class="w-full px-4 py-4 md:px-6 md:py-6">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>
<div class="fixed inset-0 z-40 lg:hidden" style="display: none" data-show="$sidebarOpen">
    <div class="absolute inset-0 bg-base-content/25" data-on:click="$sidebarOpen = false"></div>
    <aside class="relative h-full w-[min(14.5rem,calc(100vw-4rem))] bg-base-100 shadow-2xl">
        {% include "core/navbar.html" with sidebar_mode="mobile" theme_toggle_id="theme-toggle-mobile" %}
    </aside>
</div>
<script>
    const themeToggles = [
        ...document.querySelectorAll(".theme-controller"),
        ...document.querySelectorAll("input[data-theme-toggle]")
    ];
    const syncThemeToggles = (theme) => {
        themeToggles.forEach((toggle) => {
            toggle.checked = theme === "dark";
        });
    };
    if (themeToggles.length) {
        const currentTheme = document.documentElement.getAttribute("data-theme") || "light";
        syncThemeToggles(currentTheme);
        themeToggles.forEach((toggle) => {
            toggle.addEventListener("change", () => {
                const nextTheme = toggle.checked ? "dark" : "light";
                document.documentElement.setAttribute("data-theme", nextTheme);
                localStorage.setItem("theme", nextTheme);
                syncThemeToggles(nextTheme);
            });
        });
    }

    const themeSwitchSignalNode = document.getElementById("theme-switch-cmd");
    if (themeSwitchSignalNode) {
        let lastAppliedThemeCommand = "";
        const applyThemeFromSignal = () => {
            const nextTheme = (themeSwitchSignalNode.textContent || "").trim();
            if (!nextTheme || nextTheme === lastAppliedThemeCommand) {
                return;
            }
            lastAppliedThemeCommand = nextTheme;
            document.documentElement.setAttribute("data-theme", nextTheme);
            localStorage.setItem("theme", nextTheme);
            syncThemeToggles(nextTheme);
        };
        const themeSignalObserver = new MutationObserver(applyThemeFromSignal);
        themeSignalObserver.observe(themeSwitchSignalNode, {
            childList: true,
            characterData: true,
            subtree: true,
        });
        applyThemeFromSignal();
    }
</script>
</body>
</html>
