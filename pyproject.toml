[project]
name = "dux"
version = "0.9.35"
description = "NL -> SQL agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "clickhouse-connect>=0.10.0",
    "clickhouse-sqlalchemy>=0.3.2",
    "daphne>=4.2.1",
    "datastar-py>=0.8.0",
    "django>=6.0.1",
    "django-allauth>=65.14.3",
    "httpx[socks]>=0.28.1",
    "langchain>=1.3.4",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "loguru>=0.7.3",
    "pytest>=8.4.2",
    "pytest-django>=4.11.1",
    "pyodbc>=5.1.0",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.0",
    "sqlglot[rs]>=28.10.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "config.settings"
